<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camera Dashboard</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <section id="login-section" style="padding: 20px; text-align: center;">
      <h2>Login</h2>
      <div>
          <label for="username">Username:</label>
          <input type="text" id="username" name="username" value="admin" style="margin-bottom: 10px;"><br>
          <label for="password">Password:</label>
          <input type="password" id="password" name="password" value="admin123" style="margin-bottom: 10px;"><br>
          <button id="login-button">Login</button>
          <p id="login-message" style="color: red; margin-top: 10px;"></p>
      </div>
  </section>
  <header>
    <h1>Camera Monitoring Dashboard</h1>
    <button id="logout-button" style="display:none; float: right; margin: 10px;">Logout</button>
  </header>

  <div id="main-app-content" style="display:none;">
    <div id="app-message-area" style="padding: 10px; text-align: center; display: none; border: 1px solid transparent; border-radius: 4px; margin-bottom:15px;">
        <p id="app-message-text" style="margin: 0; font-weight: bold;"></p>
    </div>
    <main>
      <section id="camera-controls">
        <h2>Controls</h2>
      <div class="control-buttons">
        <button id="refresh-feed">Refresh Feed</button>
        <button id="toggle-night-vision">Toggle Night Vision</button>
        <button id="toggle-autofocus">Toggle Auto Focus</button>
      </div>
    </section>

    <section id="live-feed">
      <h2>Live Feed</h2>
      <div id="feed-container">
        <img id="camera-feed" src="" alt="Live Camera Feed"/>
      </div>
    </section>

    <section id="camera-list">
      <h2>Connected Cameras</h2>
      <ul id="camera-list-container"></ul>
    </section>
  </main>
  </div>

  <footer>
    <p>&copy; 2025 Camera Tool</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
