<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Camera Dashboard</title>
  <link rel="stylesheet" href="cyberpunk-theme.css">
  <link rel="stylesheet" href="style.css"/>
</head>
<body class="bg-dark fg-cyan oxanium-font">
  <section id="login-section" class="cyber-tile bg-dark fg-yellow ac-yellow cyber-razor-bottom" style="padding: 20px; text-align: center; margin: 50px auto; width: fit-content;">
      <h2 class="cyber-h cyberpunk-font-og ac-yellow" style="margin-bottom: 30px; width:auto;">Login Access</h2>
      <div style="margin-bottom: 20px;"> <!-- Wrapper for inputs -->
          <div class="cyber-input ac-cyan fg-cyan" style="margin-bottom: 15px; display: inline-block; position:relative;">
              <label for="username" class="cyberpunk-font fg-yellow" style="display: block; text-align: left; margin-left: var(--input-padding-left); margin-bottom: 5px;">SYSTEM ID:</label>
              <input type="text" id="username" name="username" value="admin">
          </div>
          <br> <!-- Simple line break for layout -->
          <div class="cyber-input ac-cyan fg-cyan" style="margin-bottom: 15px; display: inline-block; position:relative;">
              <label for="password" class="cyberpunk-font fg-yellow" style="display: block; text-align: left; margin-left: var(--input-padding-left); margin-bottom: 5px;">PASSCODE:</label>
              <input type="password" id="password" name="password" value="admin123">
          </div>
      </div>
      <button id="login-button"
              class="cyber-button fg-yellow bg-purple ac-yellow cyberpunk-font"
              data-text="ACCESS" style="--button-shadow-primary: var(--yellow); --button-shadow-secondary: var(--cyan);">
          ACCESS GRANTED
          <span class="tag">ENGAGE</span>
      </button>
      <p id="login-message" class="cyberpunk-font fg-red" style="margin-top: 20px; min-height: 1.5em;"></p>
  </section>
  <header>
    <h1 class="cyber-banner fg-black cyberpunk-font-og" style="--banner-color1: var(--yellow); --banner-color2: var(--cyan); --banner-color3: var(--red); --banner-color4: var(--purple); --banner-gradient-stop: 350px; line-height: 50px; font-size: 1.8rem;">SYSTEM MONITOR</h1>
    <button id="logout-button" class="cyber-button-small bg-red fg-yellow ac-red cyberpunk-font" style="display:none; position: absolute; top: 10px; right: 10px;" data-text="LOGOUT">LOGOUT<span class="tag">ESC</span></button>
  </header>

  <div id="main-app-content" style="display:none;">
    <main>
      <div style="max-width: 1200px; margin: 0 auto; padding: 20px;">
        <div id="app-message-area" class="cyber-tile ac-cyan fg-cyan cyber-glitch-2" style="background-color: rgba(10,20,30,0.8); padding: 10px; text-align: center; display: none; border: 1px solid var(--cyan); border-radius: 4px; margin: 15px auto; width: 80%;">
            <p id="app-message-text" style="margin: 0; font-weight: bold;"></p>
        </div>

        <div class="control-buttons" style="margin-bottom: 20px; text-align:right;">
             <button id="refresh-feed" class="cyber-button-small cyberpunk-font bg-blue fg-white ac-white" data-text="RFRSH">Refresh Feed<span class="tag">F5</span></button>
        </div>

        <section id="camera-settings-panel" class="cyber-tile bg-dark-transparent ac-green fg-green cyber-razor-top" style="background-color: rgba(20,35,30,0.9); padding:20px; margin-bottom:20px;">
            <h2 class="cyber-h cyberpunk-font-og ac-green" style="width:auto; margin-bottom:25px;">CAMERA CONFIGURATION :: ID <span id="selected-camera-id-display">N/A</span></h2>

            <div class="settings-form-layout" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">

                <fieldset class="cyber-fieldset ac-cyan" style="border-color: var(--cyan);">
                    <legend class="cyberpunk-font fg-cyan">Image & Display</legend>

                    <div class="cyber-input-container">
                        <label for="setting-resolution" class="cyberpunk-font">Resolution:</label>
                        <div class="cyber-select ac-cyan fg-cyan" style="width:100%;">
                            <select id="setting-resolution">
                                <option value="640x480">640x480</option>
                                <option value="1280x720" selected>1280x720</option>
                                <option value="1920x1080">1920x1080</option>
                            </select>
                        </div>
                    </div>

                    <div class="cyber-input-container">
                        <label for="setting-brightness" class="cyberpunk-font">Brightness (<span id="brightness-value-label">50</span>):</label>
                        <input type="range" id="setting-brightness" min="0" max="100" value="50" class="cyber-range ac-cyan">
                    </div>
                    <div class="cyber-input-container">
                        <label for="setting-contrast" class="cyberpunk-font">Contrast (<span id="contrast-value-label">50</span>):</label>
                        <input type="range" id="setting-contrast" min="0" max="100" value="50" class="cyber-range ac-cyan">
                    </div>
                    <div class="cyber-input-container">
                        <label for="setting-saturation" class="cyberpunk-font">Saturation (<span id="saturation-value-label">50</span>):</label>
                        <input type="range" id="setting-saturation" min="0" max="100" value="50" class="cyber-range ac-cyan">
                    </div>
                    <div class="cyber-input-container">
                        <label for="setting-sharpness" class="cyberpunk-font">Sharpness (<span id="sharpness-value-label">50</span>):</label>
                        <input type="range" id="setting-sharpness" min="0" max="100" value="50" class="cyber-range ac-cyan">
                    </div>
                </fieldset>

                <fieldset class="cyber-fieldset ac-yellow" style="border-color: var(--yellow);">
                    <legend class="cyberpunk-font fg-yellow">Features</legend>
                    <div class="cyber-checkbox-container">
                        <input type="checkbox" id="setting-night-vision" class="cyber-check ac-yellow"><label for="setting-night-vision" class="cyberpunk-font">Night Vision</label>
                    </div>
                    <div class="cyber-checkbox-container">
                        <input type="checkbox" id="setting-autofocus" class="cyber-check ac-yellow"><label for="setting-autofocus" class="cyberpunk-font">Auto Focus</label>
                    </div>
                    <div class="cyber-checkbox-container">
                        <input type="checkbox" id="setting-microphone-enabled" class="cyber-check ac-yellow"><label for="setting-microphone-enabled" class="cyberpunk-font">Microphone</label>
                    </div>
                     <div class="cyber-checkbox-container">
                        <input type="checkbox" id="setting-object-detection-enabled" class="cyber-check ac-yellow"><label for="setting-object-detection-enabled" class="cyberpunk-font">Object Detection</label>
                    </div>
                </fieldset>

                <fieldset class="cyber-fieldset ac-red" style="border-color: var(--red);">
                    <legend class="cyberpunk-font fg-red">Motion Detection</legend>
                    <div class="cyber-checkbox-container">
                        <input type="checkbox" id="setting-motion-detection-enabled" class="cyber-check ac-red"><label for="setting-motion-detection-enabled" class="cyberpunk-font">Enable</label>
                    </div>
                    <div class="cyber-input-container">
                        <label for="setting-motion-sensitivity" class="cyberpunk-font">Sensitivity (<span id="motion-sensitivity-value-label">30</span>):</label>
                        <input type="range" id="setting-motion-sensitivity" min="0" max="100" value="30" class="cyber-range ac-red">
                    </div>
                    <div class="cyber-input-container">
                        <label for="setting-motion-min-area" class="cyberpunk-font">Min. Area:</label>
                        <div class="cyber-input ac-red fg-red" style="width:100%;">
                             <input type="number" id="setting-motion-min-area" min="100" max="10000" step="50" value="500">
                        </div>
                    </div>
                    <div class="cyber-checkbox-container">
                        <input type="checkbox" id="setting-record-on-motion" class="cyber-check ac-red"><label for="setting-record-on-motion" class="cyberpunk-font">Record on Motion</label>
                    </div>
                </fieldset>
            </div>

            <div style="text-align: center; margin-top: 30px;">
                <button id="save-camera-settings" class="cyber-button bg-green fg-black ac-black cyberpunk-font" data-text="COMMIT">
                    Apply Configuration <span class="tag">S</span>
                </button>
            </div>
        </section>

        <section id="live-feed" class="cyber-tile bg-black ac-cyan fg-cyan cyber-razor-top" style="padding:15px; margin-bottom:20px;">
          <h2 class="cyber-h cyberpunk-font-og ac-cyan" style="width:auto; margin-bottom:20px;">VISUAL FEED</h2>
          <div id="feed-container">
            <img id="camera-feed" src="" alt="Live Camera Feed" class="cyber-glitch-1" style="width: 100%; min-height: 240px; background-color: #111; border: 2px solid var(--cyan); object-fit: cover;"/>
          </div>
        </section>

        <section id="camera-list" class="cyber-tile ac-purple fg-purple cyber-razor-top" style="background-color: rgba(30,30,40,0.85); padding:15px; margin-bottom:20px;">
          <h2 class="cyber-h cyberpunk-font-og ac-purple" style="width:auto; margin-bottom:15px;">NETWORK ASSETS</h2>
          <ul id="camera-list-container" class="cyber-ul-1 ac-purple" style="max-height: 200px; overflow-y: auto; padding-right: 10px;"></ul>
        </section>
      </div>
    </main>
  </div>

  <footer class="bg-black">
    <p class="cyberpunk-font fg-yellow" style="text-align:center; padding: 20px 10px; border-top: 2px solid var(--yellow);">&copy; 2077 CamKord Systems - Secure Watch Division</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
