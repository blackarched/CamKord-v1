[alembic]
# path to migration scripts
script_location = alembic

# sqlalchemy.url will be set from env.py using the application's config.
# So, the value here is less critical but can be a placeholder or dev default.
# It's good practice for this to match your development database if you run alembic locally.
sqlalchemy.url = sqlite:///./data/camkord_dev_for_alembic.db

# Other alembic configurations can be added here if needed
# e.g., file_template, timezone, logging configuration.
# Example:
# file_template = %%(rev)s_%%(slug)s
# timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
